# godbsync 示例配置：MySQL -> SQL Server 同步
# 复制本文件为 config.yaml 并按实际环境修改。

# ===== 源库（MySQL）=====
source:
  dialect: mysql
  host: xxx
  port: 3306
  username: xxx
  password: xxx
  database: xxx
  charset: utf8mb4
  timezone: UTC

# ===== 目标库（SQL Server）=====
target:
  dialect: mysql
  host: xxx
  port: 3306
  username: xxx
  password: xxx
  database: xxx          # 目标数据库名
  charset: utf8mb4
  timezone: UTC

# ===== 进度存储 =====
# 目标库为 SQL Server 时，进度后端可用 sqlite 或「独立 MySQL」（state.mysql 段）。
state:
  backend: sqlite
  path: godbsync.db

# ===== 全局选项 =====
workers: 4
log_level: info
auto_validate: true
validate_sample_size: 100

# ===== 待同步表 =====
tables:
  - name: "*"         # MySQL 源表名（通配符，须加引号）
    target: "*"       # 目标表名（通配符，须加引号；与源同名）
    mode: full
    truncate: true
    batch_size: 2000
