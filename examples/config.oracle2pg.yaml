# Oracle → PostgreSQL 同步示例
# Oracle 作为源端（Reader），PostgreSQL 作为目标端（Writer）。
# 幂等写入：PostgreSQL 目标用 INSERT ... ON CONFLICT (pk) DO UPDATE（无主键退化为普通 INSERT）。
# 进度默认存本地 SQLite（godbsync.db）；也可在 state 段改用独立 MySQL。
source:
  dialect: oracle
  host: 127.0.0.1
  port: 1521
  username: srcuser
  password: srcpass
  service: ORCLPDB1       # 必填：Oracle 服务名或 SID
  # conn_type: service    # 可选：service（默认，12c+ 多租户）或 sid（11g 及更早）

target:
  dialect: postgresql
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: pgpass
  database: dstdb          # 必填：PostgreSQL 数据库名
  schema: public           # 可选：目标表缺省 schema（默认 public）
  # encrypt: disable       # 可选：覆盖 sslmode（require/verify-ca/verify-full）

tables:
  - name: ORDERS
    mode: full
  - name: USERS
    mode: incremental
    watermark: ID          # 增量模式必须指定单调水位列
